# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/manager/webserver.pid;
error_log /var/log/sdkwork/manager/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:18092;
    }
    server {
        listen 80;
        server_name admin-demo.sdkwork.com admin-demo.birdcoder.com admin-demo.dtupay.com admin-demo.noaper.com admin-demo.sdkwork.cn admin-demo.birdcoder.cn admin-demo.dtupay.cn admin-demo.noaper.cn admin-demo.skubc.com admin-demo.skubc.cn admin-demo.zowalk.com admin-demo.zowalk.cn admin-demo.offer86.com admin-demo.offer86.cn admin-demo.86offer.com admin-demo.86offer.cn;
        include snippets/gateway-api-locations.nonproduction.conf;
        location / {
            root /usr/share/sdkwork/manager/web/pc;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
