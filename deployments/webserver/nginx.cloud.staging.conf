# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/manager/webserver.pid;
error_log /var/log/sdkwork/manager/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name admin-staging.sdkwork.com admin-staging.birdcoder.com admin-staging.dtupay.com admin-staging.sdkwork.cn admin-staging.birdcoder.cn admin-staging.dtupay.cn admin-staging.skubc.com admin-staging.skubc.cn admin-staging.zowalk.com admin-staging.zowalk.cn admin-staging.offer86.com admin-staging.offer86.cn admin-staging.86offer.com admin-staging.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
